name: Build applications

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional version tag to publish after all builds pass (e.g. v1.2.0)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify signed app
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$BUILD_ARCH"
          mkdir -p dist
          ./build-app.command "$PWD/dist/UU 修补工具.app"
          test "$(lipo -archs 'dist/UU 修补工具.app/Contents/MacOS/UUCommandGuard')" = "$BUILD_ARCH"
          python3 tests/check-artifact-privacy.py 'dist/UU 修补工具.app/Contents/MacOS/UUCommandGuard'
      - name: Test remote matching and UDP lifecycle
        run: |
          xcrun swiftc -warnings-as-errors remote-peer.swift tests/remote-peer-tests.swift -o "$RUNNER_TEMP/uu-peer-tests"
          "$RUNNER_TEMP/uu-peer-tests"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.arch == 'arm64'
        with:
          go-version-file: windows/go.mod
          cache: false
      - name: Test Go core and cross-language UDP
        if: matrix.arch == 'arm64'
        run: |
          (cd windows && go test -race -count=1 ./...)
          python3 tests/udp-interop.py
      - name: Package application and license
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          package="UUCommandGuard-Mac-$BUILD_ARCH"
          mkdir -p "dist/$package"
          ditto 'dist/UU 修补工具.app' "dist/$package/UU 修补工具.app"
          cp LICENSE "dist/$package/LICENSE"
          cat > "dist/$package/INSTALL.txt" <<'EOF'
          macOS 13 or later. Move UU 修补工具.app to Applications and open it.
          Allow Accessibility access, then choose Retry input listener from the menu.
          This build uses ad-hoc signing and is not Apple notarized.
          If macOS blocks opening, use System Settings > Privacy & Security > Open Anyway.
          Configuration: https://github.com/iomect/uu-command-guard#安装与配置
          EOF
          codesign --verify --strict "dist/$package/UU 修补工具.app"
          ditto -c -k --sequesterRsrc --keepParent "dist/$package" "dist/$package.zip"
          python3 tests/check-artifact-privacy.py "dist/$package.zip"
          (cd dist && shasum -a 256 "$package.zip" > "$package.zip.sha256")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: UU-Mac-${{ matrix.arch }}
          path: |
            dist/UUCommandGuard-Mac-${{ matrix.arch }}.zip
            dist/UUCommandGuard-Mac-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: windows/go.mod
          cache: false
      - name: Test Windows native ABI and offline state
        working-directory: windows
        run: go test -count=1 ./...
      - name: Build Windows GUI executable
        working-directory: windows
        run: |
          New-Item -ItemType Directory -Force ..\dist | Out-Null
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o ..\dist\UUCommandBridge.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify executable and package license
        run: |
          $bytes = [IO.File]::ReadAllBytes('dist/UUCommandBridge.exe')
          $pe_offset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $pe_offset + 4)
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe_offset + 24 + 68)
          if ($machine -ne 0x8664 -or $subsystem -ne 2) { throw 'Expected Windows x64 GUI executable' }
          python tests/check-artifact-privacy.py dist/UUCommandBridge.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = 'dist/UUCommandBridge-Windows-x64'
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item dist/UUCommandBridge.exe, LICENSE -Destination $package
          @'
          Windows x64. Unzip and double-click UUCommandBridge.exe.
          Enter the Mac IPv4 address in the settings window.
          Configuration: https://github.com/iomect/uu-command-guard#安装与配置
          '@ | Set-Content -Encoding utf8 "$package/INSTALL.txt"
          $archive = "$package.zip"
          Compress-Archive -Path $package -DestinationPath $archive
          python tests/check-artifact-privacy.py $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$archive.sha256", "$hash  UUCommandBridge-Windows-x64.zip`n", [Text.Encoding]::ASCII)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: UU-Windows-x64
          path: |
            dist/UUCommandBridge-Windows-x64.zip
            dist/UUCommandBridge-Windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: UU-*
          path: release
          merge-multiple: true
      - name: Verify checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[A-Za-z0-9._-]+$ ]] || { echo 'Expected a version tag starting with v'; exit 1; }
          (cd release && sha256sum -c ./*.sha256)
          python3 tests/check-artifact-privacy.py release/*.zip
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          GitHub Actions builds for Apple Silicon Mac, Intel Mac and Windows x64.
          Each ZIP includes the application, MIT license and installation instructions.
          SHA256 files are provided alongside the archives.
          Mac builds support macOS 13 or later and use ad-hoc signing; they are not Apple notarized.
          Automated offline tests do not replace real UU remote-input validation.
          EOF
          if ! gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" >/dev/null
          fi
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$GITHUB_SHA"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --verify-tag --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" release/*.zip release/*.sha256 --clobber
          gh release edit "$RELEASE_TAG" --draft=false
